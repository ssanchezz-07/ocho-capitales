# Ocho Capitales: actualiza noticias y publica el sitio en GitHub Pages (gratis).
# Se ejecuta al subir cambios, a mano desde la pestaña «Actions» y por horario.
# GitHub retrasa o se salta muchas ejecuciones programadas: por eso se despierta 3 veces por hora
# y el trabajo «comprobar» corta en segundos si las noticias se leyeron hace menos de 40 minutos.
# Resultado: una actualización por hora aunque GitHub se salte dos de cada tres avisos, sin servicios externos.
# Las noticias y agendas que lee el bot se guardan en la rama «datos» (un único commit que se reescribe), no en main:
# así el historial no crece ~100 MB al mes y main solo tiene commits de personas (tools/datos-rama.sh).
# Cloudflare Pages (trabajo «cloudflare») se activa solo al añadir los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
# Con la variable NOTICIAS_URL, cada lectura sube solo news.json a R2 (la página de Noticias lo pide ahí) y la web entera
# se vuelve a subir a Cloudflare solo cuando cambia de verdad (tools/cloudflare-decidir.mjs). GUIA-ALOJAMIENTO.md.
# Red de seguridad (tools/red-seguridad.sh): antes de publicar se comprueban datos, enlaces, límites y una prueba de humo con
# navegador; si algo falla, no se publica y se queda la versión anterior. En Cloudflare, otra prueba después de subir y, si
# falla, vuelta automática al despliegue anterior. Las ramas «prueba-red/…» pasan las comprobaciones sin publicar nada.
name: Publicar Ocho Capitales

on:
  push:
    branches: [main, "prueba-red/**"]
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.edad.outputs.seguir }}
    steps:
      - id: edad
        env:
          EVENTO: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          # la última lectura está en la rama datos; si aún no existe, se sigue (primera vez)
          git init -q d && (cd d && git fetch -q --depth=1 "https://github.com/$REPO" datos && git show FETCH_HEAD:site/data/news.json > ../news.json) || echo '{}' > news.json
          MIN=$(node -e "const n=require('./news.json'); console.log(Math.round((Date.now() - (n.actualizado || 0)) / 60000))")
          echo "Última lectura de noticias: hace $MIN minutos (evento: $EVENTO)"
          if [ "$EVENTO" = "schedule" ] && [ "$MIN" -lt 40 ]; then echo "seguir=no" >> "$GITHUB_OUTPUT"; else echo "seguir=si" >> "$GITHUB_OUTPUT"; fi
  construir:
    needs: comprobar
    if: needs.comprobar.outputs.seguir == 'si'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # guarda news.json y las agendas en la rama datos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Instalar
        working-directory: site
        run: npm ci
      - name: Traer noticias y agendas (rama datos)
        run: bash tools/datos-rama.sh traer
      - name: Comprobar el detector de eventos
        working-directory: site
        run: node eventos.mjs
      - name: Leer noticias
        working-directory: site
        timeout-minutes: 3
        continue-on-error: true   # si una fuente se cuelga, se publica con las noticias anteriores
        run: node fetch-news.mjs
      - name: Leer agendas cofrades
        timeout-minutes: 3
        continue-on-error: true   # si una agenda falla, se conserva la última buena
        run: |
          node tools/agenda-externa.mjs
          node tools/detectar-cambios-bandas.mjs
      - name: Guardar noticias y agendas (rama datos)
        # Si no se puede subir, se avisa y se publica igualmente con las noticias frescas.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "Ocho Capitales bot"
          git config user.email "actions@users.noreply.github.com"
          bash tools/datos-rama.sh guardar || echo "::warning::No se pudieron guardar las noticias en la rama datos; se publica igualmente"
      - name: Generar sitio
        working-directory: site
        env:
          # Copia de seguridad en GitHub Pages. Con GITHUB_REDIRIGE_A (p. ej. https://ochocapitales.com) cada página
          # lleva al visitante a la misma página del dominio, con el canónico allí.
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: ${{ vars.GITHUB_REDIRIGE_A || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          REDIRIGIR: ${{ vars.GITHUB_REDIRIGE_A && '1' || '' }}
          FORMULARIO_CLAVE: ${{ vars.FORMULARIO_CLAVE }}   # Colabora → correo del portal (Web3Forms; ver GUIA-ALOJAMIENTO.md)
          NOTICIAS_URL: ${{ vars.NOTICIAS_URL }}
        run: node build.mjs
      - name: Instalar el navegador de las pruebas
        run: |
          npm i --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.64.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Red de seguridad (si falla, no se publica)
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
          SIN_HUMO: ${{ vars.GITHUB_REDIRIGE_A && '1' || '' }}   # con la redirección al dominio, cada página se va del sitio
        run: bash tools/red-seguridad.sh site/dist "/${{ github.event.repository.name }}/"
      - name: Noticias a R2 (sin volver a publicar la web)
        # Solo en main, con la variable NOTICIAS_URL y los secretos de Cloudflare, y si news.json pasa la validación.
        # Si no, se queda el anterior en R2; la página tiene además el respaldo que va dentro de la web.
        if: ${{ vars.NOTICIAS_URL != '' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUBO: ${{ vars.R2_CUBO || 'ocho-capitales-datos' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Faltan los secretos de Cloudflare"; exit 0; fi
          node tools/validar-noticias.mjs site/dist/news.json || { echo "::warning::news.json no pasa la validación: se queda el anterior en R2"; exit 0; }
          npx --yes wrangler@4.148.0 r2 bucket cors set "$CUBO" --file tools/r2-cors.json --force || echo "::warning::No se pudo fijar el CORS de $CUBO"
          npx --yes wrangler@4.148.0 r2 object put "$CUBO/news.json" --file site/dist/news.json --remote --content-type "application/json; charset=utf-8" --cache-control "public, max-age=120, stale-while-revalidate=3600"
      - name: Base de datos y auditoría
        # SQLite con todo lo verificado y su procedencia; la auditoría (datos/auditoria.json) lista huecos y posibles errores
        continue-on-error: true
        run: node tools/db/construir.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist
  desplegar:
    needs: construir
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  cloudflare:
    if: github.ref == 'refs/heads/main'
    # Web en Cloudflare Pages: caché larga, Brotli, cabeceras de seguridad (site/despliegue.mjs) y /api/sugerencias.
    # Solo se sube cuando cambia algo que sale en la web (tools/cloudflare-decidir.mjs): los documentos no cuentan y,
    # con las noticias en R2, la lectura de cada hora tampoco (una vez al día, para la portada y «Hoy»).
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: decidir
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.event.after }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NOTICIAS_URL: ${{ vars.NOTICIAS_URL }}
          TOPE: ${{ vars.CLOUDFLARE_TOPE_MES || '450' }}
        run: node tools/cloudflare-decidir.mjs
      - if: steps.decidir.outputs.seguir == 'si'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Traer noticias y agendas (rama datos)
        if: steps.decidir.outputs.seguir == 'si'
        run: bash tools/datos-rama.sh traer
      - name: Generar sitio para la raíz del dominio
        if: steps.decidir.outputs.seguir == 'si'
        working-directory: site
        env:
          BASE_PATH: /
          SITE_URL: ${{ vars.CLOUDFLARE_URL || 'https://ocho-capitales.pages.dev' }}
          FORMULARIO_CLAVE: ${{ vars.FORMULARIO_CLAVE }}
          FORMULARIO_DESTINO: ${{ vars.FORMULARIO_DESTINO }}   # «api»: /api/sugerencias de Cloudflare en vez de Web3Forms
          NOTICIAS_URL: ${{ vars.NOTICIAS_URL }}
        run: node build.mjs
      - name: Instalar el navegador de las pruebas
        if: steps.decidir.outputs.seguir == 'si'
        run: |
          npm i --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.64.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Red de seguridad (si falla, no se publica)
        if: steps.decidir.outputs.seguir == 'si'
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
        run: bash tools/red-seguridad.sh site/dist /
      - name: Apuntar el despliegue publicado ahora
        id: antes
        if: steps.decidir.outputs.seguir == 'si'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/cloudflare-volver.mjs apuntar
      - name: Subir a Cloudflare Pages
        if: steps.decidir.outputs.seguir == 'si'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # functions/ (sugerencias) y la base D1 se leen de wrangler.toml en la raíz
        run: npx --yes wrangler@4.148.0 pages deploy site/dist --project-name ocho-capitales --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Prueba de humo en la web publicada
        id: despues
        if: steps.decidir.outputs.seguir == 'si'
        continue-on-error: true
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
          URL: ${{ vars.CLOUDFLARE_URL || 'https://ocho-capitales.pages.dev' }}
        run: |
          sleep 20   # lo que tarda Cloudflare en servir el despliegue nuevo en todas partes
          node tools/prueba-humo.mjs "$URL/" || { sleep 30; node tools/prueba-humo.mjs "$URL/"; }
      - name: Si falla, volver al despliegue anterior
        if: steps.decidir.outputs.seguir == 'si' && steps.despues.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node tools/cloudflare-volver.mjs volver "${{ steps.antes.outputs.anterior }}"
          exit 1   # el trabajo queda en rojo para que se vea
