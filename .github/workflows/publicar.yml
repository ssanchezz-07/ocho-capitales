# Ocho Capitales: actualiza noticias y publica el sitio en GitHub Pages (gratis).
# Se ejecuta al subir cambios, a mano desde la pestaña «Actions» y por horario.
# GitHub retrasa o se salta muchas ejecuciones programadas: por eso se despierta 3 veces por hora
# y el trabajo «comprobar» corta en segundos si las noticias se leyeron hace menos de 40 minutos.
# Resultado: una actualización por hora aunque GitHub se salte dos de cada tres avisos, sin servicios externos.
name: Publicar Ocho Capitales

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.edad.outputs.seguir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: site/data/news.json
          sparse-checkout-cone-mode: false
      - id: edad
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          MIN=$(node -e "const n=require('./site/data/news.json'); console.log(Math.round((Date.now() - (n.actualizado || 0)) / 60000))")
          echo "Última lectura de noticias: hace $MIN minutos (evento: $EVENTO)"
          if [ "$EVENTO" = "schedule" ] && [ "$MIN" -lt 40 ]; then echo "seguir=no" >> "$GITHUB_OUTPUT"; else echo "seguir=si" >> "$GITHUB_OUTPUT"; fi
  construir:
    needs: comprobar
    if: needs.comprobar.outputs.seguir == 'si'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # guarda news.json y las agendas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Instalar
        working-directory: site
        run: npm ci
      - name: Comprobar el detector de eventos
        working-directory: site
        run: node eventos.mjs
      - name: Leer noticias
        working-directory: site
        timeout-minutes: 3
        continue-on-error: true   # si una fuente se cuelga, se publica con las noticias anteriores
        run: node fetch-news.mjs
      - name: Leer agendas cofrades
        timeout-minutes: 3
        continue-on-error: true   # si una agenda falla, se conserva la última buena
        run: |
          node tools/agenda-externa.mjs
          node tools/detectar-cambios-bandas.mjs
      - name: Guardar archivo de noticias
        run: |
          git config user.name "Ocho Capitales bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/news.json tools/sources/agenda-externa.json tools/sources/agenda-cuerpos.json tools/sources/agenda-urls.json tools/sources/cambios-bandas.json
          # Si otro commit ha llegado mientras se leían las noticias, se integra conservando el news.json recién leído.
          # Si aun así no se puede subir, se avisa y se publica igualmente con las noticias frescas.
          git diff --cached --quiet || (git commit -m "Noticias: actualización automática" && git pull --rebase -X theirs origin main && git push) || (git rebase --abort 2>/dev/null; echo "::warning::No se pudo guardar news.json en el repositorio; se publica igualmente")
      - name: Generar sitio
        working-directory: site
        env:
          # Con dominio propio, cambia BASE_PATH a "/" y SITE_URL a tu dominio.
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node build.mjs
      - name: Base de datos y auditoría
        # SQLite con todo lo verificado y su procedencia; la auditoría (datos/auditoria.json) lista huecos y posibles errores
        continue-on-error: true
        run: node tools/db/construir.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist
      - name: Publicar también en Cloudflare Pages (cuando esté configurado)
        # Se activa al añadir los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. Mientras, no hace nada.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_URL: ${{ vars.CLOUDFLARE_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Cloudflare aún no configurado"; exit 0; fi
          cd site && BASE_PATH=/ SITE_URL="${CF_URL:-https://ocho-capitales.pages.dev}" DIST_DIR=dist-cf node build.mjs && cd ..
          sed -i 's#pages_build_output_dir = "site/dist"#pages_build_output_dir = "site/dist-cf"#' wrangler.toml
          npx --yes wrangler@3 pages deploy site/dist-cf --project-name ocho-capitales --branch main
  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
