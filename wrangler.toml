# Ocho Capitales en Cloudflare Pages (plan gratuito). La web estática sale de site/dist y functions/ añade /api/sugerencias.
# Hecho el 2026-10-16: base D1 «ocho-capitales» (weur) con datos/sugerencias.sql y proyecto de Pages «ocho-capitales»
# con la base enlazada como DB. Falta (lo hace Pablo, son claves): el secreto RESUMEN_TOKEN del proyecto y, en GitHub,
# CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. El primer despliegue, solo con «publica».
# Lo sube el trabajo «cloudflare» de .github/workflows/publicar.yml (site/dist generado con BASE_PATH=/). Guía: GUIA-ALOJAMIENTO.md.
name = "ocho-capitales"
pages_build_output_dir = "site/dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "ocho-capitales"
database_id = "9d88df7e-020c-4ad9-98eb-6e3ba8a136c6"
